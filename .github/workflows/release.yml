name: Release (Docker image)

# The StartOS package no longer lives in this repo — it moved to
# heatpunk/blisspoint-startos (SDK 3, standard package layout), which builds and
# publishes its own .s9pk from the image this workflow produces. The legacy
# s9pk job here was retired; see docs/PACKAGING-PLATFORMS.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Release-gate: refuse to ship a single-arch image. The 0.6.0 tag was
      # once overwritten by a manual amd64-only push; this check makes that
      # class of failure fail the workflow instead of reaching users.
      - name: Verify multi-arch manifest list
        run: |
          version="${{ steps.resolve.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            arches=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${version}" 2>/dev/null | grep -oE 'linux/(amd64|arm64)' | sort -u || true)
            if [ "$(echo "$arches" | grep -c 'linux/')" -ge 2 ]; then
              echo "OK: multi-arch manifest contains:"
              echo "$arches"
              exit 0
            fi
            echo "Attempt $attempt: manifest list not multi-arch yet (registry propagation?), retrying in 15s..."
            sleep 15
          done
          echo "::error::Image ${REGISTRY}/${IMAGE_NAME}:${version} is NOT multi-arch. Found only: ${arches:-nothing}. Refusing to release."
          exit 1

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true

