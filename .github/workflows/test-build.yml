name: Test build (s9pk artifact)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build s9pk artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install StartOS SDK
        run: |
          sudo apt-get update && sudo apt-get install -y mycpp clang libssl-dev pkg-config
          curl -fsSL https://start9.com/cli/install.sh | bash || true
          npm install -g @start9labs/start-sdk || true

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=docker,dest=/tmp/blisspoint-image.tar
          tags: blisspoint:local

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blisspoint-v0.6.0-test.s9pk
          path: /tmp/blisspoint-image.tar
