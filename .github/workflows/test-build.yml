name: Test build (s9pk artifact)

on:
  push:
    branches: [main, feature/rename-to-blisspoint]
  workflow_dispatch:

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version from manifest
        id: ver
        run: |
          v=$(grep -oP "blisspoint:\K[0-9]+\.[0-9]+\.[0-9]+" startos/manifest/index.ts | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blisspoint:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/blisspoint:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  s9pk:
    name: Build s9pk & upload artifact
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools-ng squashfs-tools

      - name: Install start-cli (v1.0.3 to keep alerts field compatibility for pre-beta.10 StartOS)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2Fv1.0.3/start-cli_x86_64-linux" -o "$HOME/.local/bin/start-cli"
          chmod +x "$HOME/.local/bin/start-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build s9pk
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          
          # Initialize workspace in parent directory to satisfy start-cli requirements
          cd ..
          start-cli s9pk init-workspace .
          sed -i 's|https://dev-vm.local|http://127.0.0.1|g' .startos/config.yaml
          
          cd hashboard
          
          # Install pnpm and build SDK
          npm install -g pnpm
          pnpm --prefix sdk-build install
          pnpm --prefix sdk-build run build
          
          # Use Makefile to pack, which now correctly handles assets
          make PKG=blisspoint.s9pk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blisspoint-test-s9pk
          path: blisspoint.s9pk
