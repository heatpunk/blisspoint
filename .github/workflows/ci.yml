name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/*']

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm test
      - run: pnpm run build

  proxy-rs:
    name: Build & test proxy-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proxy-rs

      - name: cargo build
        working-directory: proxy-rs
        run: cargo build --verbose

      - name: cargo test
        working-directory: proxy-rs
        run: cargo test --verbose

      - name: cargo clippy
        working-directory: proxy-rs
        run: cargo clippy --all-targets -- -D warnings
