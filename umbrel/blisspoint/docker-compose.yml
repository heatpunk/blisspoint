version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: blisspoint_web_1
      APP_PORT: 80

  web:
    # NOTE: pin to a sha256 digest before submitting to getumbrel/umbrel-apps
    # (get it with: docker buildx imagetools inspect ghcr.io/heatpunk/blisspoint:0.5.3)
    image: ghcr.io/heatpunk/blisspoint:0.6.4@sha256:b4d2dc52ba0327097c124f98ad6dd642451f217c8aac270becbdbe2a478090a1
    restart: on-failure
    init: true
    stop_grace_period: 1m
