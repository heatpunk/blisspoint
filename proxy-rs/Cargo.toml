[package]
name = "proxy-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "proxy-rs"
path = "src/main.rs"

[dependencies]
asic-rs = { version = "0.8.10", features = [
    "antminer",
    "braiins",
    "whatsminer",
    "avalonminer",
    "luxminer",
    "vnish",
    "bitaxe",
    "epic",
    "marathon",
    "auradine",
    "futurebit",
    "nerdaxe",
    "sealminer",
] }
asic-rs-core = "0.8.10"
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8.9", features = ["http1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
regex = "1.13"
futures = "0.3.34"
measurements = "0.11.1"
anyhow = "1.0.104"

[dev-dependencies]
axum-test = "21"
tokio = { version = "1.54", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
